server:
  port: 8123
  servlet:
    context-path: /api

spring:
  config:
    import: classpath:application-session.yml,classpath:application-picture-cache.yml
  application:
    name: tuku1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tuku
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.commons.JakartaCommonsLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: v1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - learn.gjx.tuku1.controller

cos:
  client:
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}

picture:
  derivative:
    enabled: true
    # 主展示 WebP 质量；只有比原图更小时才会采用
    display-quality: 85
    # 列表缩略图最大边界与质量；不会放大原图
    thumbnail-quality: 80
    thumbnail-max-width: 512
    thumbnail-max-height: 512
    # 小于等于 20 KB 时不生成缩略图
    thumbnail-min-bytes: 20480
  file-cleanup:
    retry-delay-ms: 60000
  draft:
    cleanup-enabled: true
    expire-hours: 24
    cleanup-delay-ms: 3600000
    cleanup-batch-size: 100
